services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dole-system-app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SKIP_COMPOSER: "1"
      WEBROOT: /var/www/html
      APP_ENV: production
      APP_DEBUG: "false"
      DEBUG_MODE: "false"
      VITE_DEBUG: "false"
      LOG_LEVEL: error
      PHP_MEMORY_LIMIT: 256M
      PHP_FPM_MAX_CHILDREN: 10
      PHP_FPM_START_SERVERS: 2
      PHP_FPM_MIN_SPARE_SERVERS: 1
      PHP_FPM_MAX_SPARE_SERVERS: 3
    networks:
      - dole-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

networks:
  dole-internal:
    driver: bridge
