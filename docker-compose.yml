services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dole-system-app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
    environment:
      SKIP_COMPOSER: "1"
      WEBROOT: /var/www/html
      APP_ENV: "${APP_ENV:-development}"
      ENV_KEY: ${ENV_KEY:-localhost}
      APP_DEBUG: ${APP_DEBUG:-true}
      DEBUG_MODE: "${DEBUG_MODE:-true}"
      VITE_DEBUG: "${VITE_DEBUG:-true}"
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      VITE_CONTAINER_HOST: host.docker.internal
      PHP_MEMORY_LIMIT: 256M
      PHP_FPM_MAX_CHILDREN: 10
      PHP_FPM_START_SERVERS: 2
      PHP_FPM_MIN_SPARE_SERVERS: 1
      PHP_FPM_MAX_SPARE_SERVERS: 3
    networks:
      - dole-internal
    deploy:
      resources:
        limits:
          memory: 1024M
        reservations:
          memory: 512M

networks:
  dole-internal:
    driver: bridge
